name = "discord-channel-archiver"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Sweep once per day at 03:00 UTC (cron times are always UTC on Cloudflare).
[triggers]
crons = ["0 3 * * *"]

# D1 database binding. Replace database_id after you create the DB
# (wrangler d1 create archiver-db prints it).
[[d1_databases]]
binding = "DB"
database_name = "hotdog-db"
database_id = "3af5f901-b273-45c3-80ee-c92eb2a054b2"

# Non-secret config. GUILD_ID and ARCHIVE_CATEGORY_ID are safe to keep here.
[vars]
GUILD_ID = "693032229936431104"
ARCHIVE_CATEGORY_ID = "1487464318642556968"
PRIVILEGED_ROLE_ID = "693417843911557130"
# Every text/announcement channel is covered by default with this threshold.
# Use /arc off or /arc days to override individual channels.
DEFAULT_DAYS = "30"
# "true" = sweep only logs what it would archive/restore (watch with
# `npx wrangler tail`). Set to "false" and redeploy to let it act.
DRY_RUN = "false"

# Secrets (set via `wrangler secret put NAME`, never commit these):
#   DISCORD_TOKEN         - bot token
#   DISCORD_PUBLIC_KEY    - app public key (for verifying interactions)
#   DISCORD_APPLICATION_ID - application id (used by the register script only)
