name: Deploy Botdog

# Deploys the Worker to Cloudflare on every push to main,
# or manually from the Actions tab ("Run workflow").
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      post_commands:
        description: "Repost the command list in Discord even if the version hasn't changed"
        type: boolean
        default: false

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # needed to push the version tag

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs the wrangler version pinned in package-lock.json,
      # which wrangler-action then uses.
      - run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Decides whether this deploy is a new major or minor version (e.g. 1.7.x -> 1.8.0)
      # compared with the newest version tag, before this run adds its own tag.
      - name: Check release type
        id: release
        env:
          FORCE_POST: ${{ inputs.post_commands }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PREVIOUS="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | sort -V | tail -n 1)"
          if [ "$FORCE_POST" = "true" ]; then
            POST=true
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            POST=false
          else
            POST="$(node -e "import('./scripts/post-commands-pin.js').then(m => console.log(m.isMajorOrMinorBump(process.argv[1], process.argv[2])))" "$PREVIOUS" "$VERSION")"
          fi
          echo "Previous version tag: ${PREVIOUS:-none}. This version: v$VERSION. Post command list: $POST"
          echo "post_commands=$POST" >> "$GITHUB_OUTPUT"

      # Tags the commit with the version from package.json (e.g. v1.1.0)
      # the first time that version is deployed.
      - name: Tag release version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION already tagged, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Botdog $VERSION"
            git push origin "$VERSION"
            echo "Tagged $VERSION"
          fi

      # Posts the command list (docs/commands-pin.md) in the commands channel and
      # deletes the previous one. A failure here doesn't fail the deploy.
      - name: Post command list in Discord
        if: steps.release.outputs.post_commands == 'true'
        continue-on-error: true
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          COMMANDS_CHANNEL_ID: "1560736353094992033"
        run: node scripts/post-commands-pin.js
